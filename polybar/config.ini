[colors]
background = #2e3440
background-alt = #3b4252
foreground = #eceff4
primary = #88c0d0
secondary = #8fbcbb
alert = #bf616a
disabled = #4c566a

[bar/main]
monitor = ${env:MONITOR:}
height = 24pt
radius = 6
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3pt
border-size = 4pt
border-color = #00000000
padding-left = 0
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.disabled}
font-0 = Cascadia Mono:style=Regular
font-1 = JetBrainsMono Nerd Font:size=11;2
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; layout
modules-left = bspwm
modules-center = date
modules-right = systray sysmenu

[module/bspwm]
type = internal/bspwm
pin-workspaces = true ; keep workspaces pinned to bar order
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.primary}

[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 16pt

[module/sysmenu]
type = custom/text
label = %{T1}⏻%{T-}
content-foreground = ${colors.foreground}
click-left = rofi -show power-menu -modi power-menu:~/.config/scripts/rofi-power-menu &
